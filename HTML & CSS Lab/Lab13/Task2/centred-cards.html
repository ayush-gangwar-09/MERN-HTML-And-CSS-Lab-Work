<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centred Cards</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Pricing Plans</h1>

    <div class="row">
      <div class="card">
        <h3>Starter</h3>
        <p>Price: ₹199</p>
      </div>

      <div class="card">
        <h3>Standard</h3>
        <p>Price: ₹349</p>
      </div>

      <div class="card">
        <h3>Premium</h3>
        <p>Price: ₹499</p>
      </div>
    </div>
  </body>
</html>
