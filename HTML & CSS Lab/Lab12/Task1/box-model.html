<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Box Model</h1>

    <div class="box content-box">
      <h2>Content Box</h2>
      <p>Width: 200px</p>
      <p>Padding: 20px</p>
      <p>Border: 5px</p>
    </div>

    <div class="box border-box">
      <h2>Border Box</h2>
      <p>Width: 200px</p>
      <p>Padding: 20px</p>
      <p>Border: 5px</p>
    </div>
  </body>
</html>
